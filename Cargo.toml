[package]
name = "opencl_vanity_gpg"
version = "1.0.1"
edition = "2021"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[features]
default = ["opencl"]
# GPU search backend. Build with --no-default-features for a CPU-only binary
# that does not link against the OpenCL runtime at all.
opencl = ["dep:ocl"]

[dependencies]
byteorder = "1.5"
chrono = { version = "0.4", default-features = false, features = ["now"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
hex = "0.4"
log = "0.4"
ocl = { version = "0.19", optional = true }
pgp = "0.14"
rand = "0.8"
sha1 = { version = "0.10", features = ["compress"] }
smallvec = "1.13"
anyhow = "1.0"
indicatif = "0.17"
indicatif-log-bridge = "0.2"
